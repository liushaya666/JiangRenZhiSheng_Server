# 放入 /etc/nginx/conf.d/jiangrenzhisheng.conf，替换域名和证书路径。
# 照片 URL 含领取凭证，关闭访问日志以避免日志泄露领取链接。
server {
    listen 80;
    server_name photos.example.com;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name photos.example.com;
    ssl_certificate /etc/letsencrypt/live/photos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photos.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
    # 略大于服务端默认 30 MB，给 multipart 报文留空间。
    client_max_body_size 32m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
}
